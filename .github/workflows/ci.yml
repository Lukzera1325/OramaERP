name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Orama.sln
      - run: dotnet build Orama.sln --no-restore --configuration Release
      - name: Run integration tests
        run: dotnet test tests/Orama.Tests.Integration/Orama.Tests.Integration.csproj --no-build --configuration Release
        env:
          ORAMA_RUN_POSTGRES_TESTS: '1'
      - name: Build container image
        run: docker build --tag orama-erp:${{ github.sha }} .
